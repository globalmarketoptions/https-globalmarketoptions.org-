    .register-header p a { color: #3b82f6; text-decoration: none; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 14px; color: #ffffff; margin-bottom: 8px; font-weight: 500; }
    .form-control { width: 100%; padding: 12px 14px; background-color: #ffffff; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; color: #000000; outline: none; }
    .form-control:focus { border-color: #3b82f6; }
    select.form-control { appearance: auto; background-color: #ffffff; color: #000000; }
    
    /* Password field with eye toggle */
    .password-wrapper { position: relative; width: 100%; }
    .password-wrapper .form-control { padding-right: 42px; }
    .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #666666; display: flex; align-items: center; justify-content: center; background: none; border: none; padding: 0; }
    .toggle-password:hover { color: #000000; }
    .toggle-password svg { width: 20px; height: 20px; }

    .checkbox-group { display: flex; align-items: center; gap: 8px; margin: 20px 0; }
    .checkbox-group input { width: 18px; height: 18px; cursor: pointer; }
    .checkbox-group label { font-size: 14px; color: #ffffff; cursor: pointer; }
    .recaptcha-box { background: #ffffff; color: #000000; border: 1px solid #d1d5db; border-radius: 4px; padding: 12px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; width: 300px; max-width: 100%; }

    .recaptcha-link:hover { color: #000; }
    .btn-register { width: 100%; padding: 14px; background-color: #0070f3; color: #ffffff; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; }

  <script>
    // Initialize Supabase Client with exact keys provided
    const SUPABASE_URL = 'https://vnbxubqtgyxrkekyztay.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_328Qbeqmks1uHjZlAEm14w_63T8Nk4f';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Password Visibility Toggle
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === "password";
      input.type = isPassword ? "text" : "password";

      btn.innerHTML = isPassword ? `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      ` : `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      `;
    }

    // Handle Direct Database Registration (Bypassing Auth API Key restriction)
    document.getElementById('registration-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const pass = document.getElementById('password').value;
      const confirmPass = document.getElementById('confirm-password').value;

      if (pass !== confirmPass) {
        alert("Passwords do not match.");
        return;
      }

      const email = document.getElementById('email').value.toLowerCase().trim();
      const fullname = document.getElementById('fullname').value;
      const username = document.getElementById('username').value;
      const country = document.getElementById('country-select').value;
      const currency = document.getElementById('currency').value;
      const gender = document.getElementById('gender').value;
      const phone = document.getElementById('phone').value;

      const submitBtn = document.querySelector('.btn-register');
      submitBtn.innerText = 'CREATING ACCOUNT...';
      submitBtn.disabled = true;

      try {
        // Generate a unique client ID
        const userId = 'user_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);

        // Insert directly into public.profiles table so login and admin dashboard work seamlessly
        const { error: dbError } = await _supabase.from('profiles').insert([
          {
            id: userId,
            email: email,
            username: username,
            full_name: fullname,
            display_name: fullname,
            country: country,
            currency: currency,
            gender: gender,
            phone: phone,
            password: pass
          }
        ]);

        if (dbError) {
          alert("Error creating account: " + dbError.message);
          submitBtn.innerText = 'REGISTER';
          submitBtn.disabled = false;
          return;
        }

        alert("Account created successfully! Redirecting to login...");
        window.location.href = '/login.html';

      } catch (err) {
        alert("An error occurred during registration. Please try again.");
        submitBtn.innerText = 'REGISTER';
        submitBtn.disabled = false;
      }
    });
  </script>
