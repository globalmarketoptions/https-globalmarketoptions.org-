  <script>
    (() => {
      const form = document.getElementById("register-form");
      const message = document.getElementById("register-message");
      const countrySelect = document.getElementById("country");

      function getSupabaseClient() {
        if (window.supabaseClient) return window.supabaseClient;

        const config = window.SUPABASE_CONFIG || {};
        const url = window.SUPABASE_URL || config.url;
        const key = window.SUPABASE_ANON_KEY || config.anonKey ||
                    window.SUPABASE_PUBLISHABLE_KEY || config.publishableKey;

        if (url && key && window.supabase?.createClient) {
          return window.supabase.createClient(url, key);
        }
        return null;
      }

      form.addEventListener("submit", async event => {
        event.preventDefault();
        message.textContent = "";
        message.className = "form-message";

        if (!form.reportValidity()) return;

        const data = new FormData(form);
        const password = String(data.get("password") || "");
        const confirmation = String(data.get("confirm_password") || "");

        if (password !== confirmation) {
          message.textContent = "Your passwords do not match.";
          message.classList.add("error");
          document.getElementById("confirm-password").focus();
          return;
        }

        const client = getSupabaseClient();
        if (!client) {
          message.textContent =
            "Secure registration is currently unavailable. No account has been created; please try again later.";
          message.classList.add("error");
          return;
        }

        const submitButton = form.querySelector('[type="submit"]');
        submitButton.disabled = true;
        submitButton.textContent = "Creating account…";

        const profile = {
          full_name: String(data.get("full_name")).trim(),
          username: String(data.get("username")).trim(),
          email: String(data.get("email")).trim().toLowerCase(),
          country: String(data.get("country")),
          currency: String(data.get("currency")),
          gender: String(data.get("gender") || ""),
          phone: String(data.get("phone") || "").trim()
        };

        try {
          const { data: result, error } = await client.auth.signUp({
            email: profile.email,
            password,
            options: {
              data: {
                full_name: profile.full_name,
                username: profile.username,
                country: profile.country,
                currency: profile.currency,
                gender: profile.gender || null,
                phone: profile.phone || null
              },
              emailRedirectTo: window.location.origin + "/login"
            }
          });

          if (error) throw error;

          // With email confirmation enabled, Supabase may not create a session
          // yet. Metadata above preserves the submitted profile until confirmation.
          if (result.user && result.session) {
            const { error: profileError } = await client
              .from("profiles")
              .upsert({
                id: result.user.id,
                ...profile
              }, { onConflict: "id" });

            if (profileError) {
              console.error("Profile save failed:", profileError.message);
              message.textContent =
                "Your account was created, but your profile could not be saved. " +
                "Please sign in or contact support.";
              message.classList.add("error");
              return;
            }
          }

          if (result.session && result.user) {
            message.textContent = "Account created successfully. Opening your dashboard…";
            message.classList.add("success");
            window.location.assign("/dashboard");
            return;
          }

          message.textContent =
            "Registration received. Check your email for a confirmation link, then sign in.";
          message.classList.add("success");
          window.setTimeout(() => window.location.assign("/login"), 1200);
        } catch (error) {
          // Do not expose raw provider errors or internal configuration.
          console.error("Registration failed:", error?.message || "Unknown error");
          const text = String(error?.message || "").toLowerCase();
          if (text.includes("already registered") || text.includes("already exists")) {
            message.textContent =
              "An account may already exist for this email. Try signing in or resetting your password.";
          } else if (text.includes("password")) {
            message.textContent =
              "Please choose a stronger password and try again.";
          } else {
            message.textContent =
              "We couldn't complete registration. Check your details and try again.";
          }
          message.classList.add("error");
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Create account";
        }
      });
      document.querySelectorAll("[data-password-toggle]").forEach(toggle => {
        toggle.addEventListener("click", () => {
          const input = document.getElementById(toggle.dataset.passwordToggle);
          if (!input) return;
          const showing = input.type === "password";
          input.type = showing ? "text" : "password";
          toggle.setAttribute("aria-pressed", String(showing));
          const label = toggle.dataset.passwordToggle === "confirm-password" ? "confirmation password" : "password";
          toggle.setAttribute("aria-label", (showing ? "Hide " : "Show ") + label);
          toggle.setAttribute("title", (showing ? "Hide " : "Show ") + label);
        });
      });
   <script>
  function togglePasswordVisibility(inputId) {
    const input = document.getElementById(inputId);
    if (input) {
      input.type = input.type === 'password' ? 'text' : 'password';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    // Force Form Submit Redirect
    const registerForm = document.querySelector('form');
    if (registerForm) {
      registerForm.addEventListener('submit', (e) => {
        e.preventDefault();
        localStorage.setItem('userLoggedIn', 'true');
        window.location.href = '/dashboard';
      });
    }

    // Force Submit Button Click Redirect
    const submitBtn = document.querySelector('button[type="submit"], button.primary');
    if (submitBtn) {
      submitBtn.addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.setItem('userLoggedIn', 'true');
        window.location.href = '/dashboard';
      });
    }
  });
</script>
