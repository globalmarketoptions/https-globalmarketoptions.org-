<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <meta name="theme-color" content="#0B0F17">\n    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=3e1019e">\n    <link rel="apple-touch-icon" href="./favicon.svg?v=3e1019e">
    <title>Register - Global Market Options</title>\n    <style>body{background:#0B0F17!important;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.brand-logo{display:flex;justify-content:center;margin:0 auto 24px}.brand-logo img{width:min(260px,100%);height:auto}</style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between">
    <div class="max-w-md w-full mx-auto p-6 my-auto bg-slate-900 border border-slate-800 rounded-2xl shadow-xl"><a class="brand-logo" href="/" aria-label="Global Market Options home"><img src="./brand-logo.svg?v=4b6e3bf" alt="Global Market Options" width="260" height="47"></a>
        <h1 class="text-2xl font-bold mb-2">Create Account</h1>
        <p class="text-slate-400 mb-6 text-sm">Register to start your financial journey.</p>
        
        <form onsubmit="event.preventDefault(); localStorage.setItem('userLoggedIn', 'true'); window.location.href='/dashboard'; return false;" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-300 mb-1">Full Name</label>
                <input type="text" id="name" required placeholder="John Doe" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-1">Email address</label>
                <input type="email" id="email" required placeholder="you@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold rounded-lg transition-colors cursor-pointer">
                Create Account
            </button>
        </form>
    </div>
</body>
</html>
