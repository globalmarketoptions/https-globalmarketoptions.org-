<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo Admin Dashboard - Global Market Options</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; padding: 20px; font-size: 14px; }
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid #1e293b; margin-bottom: 24px; }
    .brand { font-size: 20px; font-weight: bold; color: #38bdf8; }
    .status { color: #10b981; font-weight: 500; }
    .card { background: #151e32; border: 1px solid #1e293b; border-radius: 8px; padding: 20px; margin-bottom: 24px; }
    .card-title { font-size: 16px; font-weight: bold; margin-bottom: 16px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px; border-bottom: 1px solid #1e293b; }
    th { color: #64748b; font-size: 12px; text-transform: uppercase; }
    .action-link { color: #38bdf8; text-decoration: none; margin-right: 12px; font-weight: 500; display: inline-block; margin-top: 4px; }
    .action-link:hover { text-decoration: underline; }
    .btn-action { background: #0284c7; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-action:hover { background: #0369a1; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">Global Market Options — Admin Management</div>
    <div class="status">● Connected to Live Database</div>
  </div>

  <div class="card">
    <div class="card-title">Registered Clients & Quick Actions</div>
    <table>
      <thead>
        <tr>
          <th>User Email</th>
          <th>Quick Actions</th>
        </tr>
      </thead>
      <tbody id="userTableBody">
        <tr>
          <td colspan="2" style="color:#94a3b8; text-align:center;">Loading client records...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <div class="card-title">KYC & ID Verification Status</div>
    <div id="kycContent" style="color:#94a3b8;">
      Select "Id Verification" on a client above to manage documents.
    </div>
  </div>

  <script>
    // 1. Initialize Supabase
    const SUPABASE_URL = 'https://vhbxubqfgyxrkekyztay.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_328Qbegmks1uHjZlAEm14w_63T8Nk4f';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- Solo Admin Access Gate ---
    const ADMIN_PASSWORD = "1983";

    function verifyAdminAccess() {
      const sessionAuth = sessionStorage.getItem("admin_authenticated");
      if (sessionAuth === "true") return true;

      const enteredPassword = prompt("🔐 Restricted Solo Admin Portal\nPlease enter your Admin Password:");
      if (enteredPassword === ADMIN_PASSWORD) {
        sessionStorage.setItem("admin_authenticated", "true");
        return true;
      } else {
        alert("❌ Access Denied: Incorrect Password.");
        document.body.innerHTML = "<h2 style='color:red; text-align:center; margin-top:50px;'>403 - Unauthorized Access Denied</h2>";
        return false;
      }
    }

    if (!verifyAdminAccess()) {
      throw new Error("Unauthorized access block triggered.");
    }

    async function loadAdminDashboard() {
      const tableBody = document.getElementById('userTableBody');
      if (!tableBody) return;

      const { data: users, error } = await _supabase.from('profiles').select('*');
      if (error || !users || users.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="2" style="color:#ef4444; text-align:center;">No users found or database connection error.</td></tr>';
        return;
      }

      tableBody.innerHTML = users.map(user => `
        <tr>
          <td><strong>${user.email || user.id}</strong></td>
          <td>
            <a class="action-link" href="mailto:${user.email || ''}">✉ Email Client</a>
            <button class="btn-action" onclick="viewIdVerification('${user.id}', '${user.email || 'Client'}')">Id Verification</button>
          </td>
        </tr>
      `).join('');
    }

    async function viewIdVerification(userId, email) {
      const kycBox = document.getElementById('kycContent');
      kycBox.innerHTML = 'Fetching verification details...';

      const { data: kyc } = await _supabase.from('kyc_records').select('*').eq('user_id', userId).single();
      if (!kyc) {
        kycBox.innerHTML = `<p style="color:#f59e0b;">No ID submitted for <strong>${email}</strong> yet.</p>`;
        return;
      }

      kycBox.innerHTML = `
        <p><strong>User:</strong> ${email}</p>
        <p><strong>Status:</strong> <span style="color:#38bdf8;">${kyc.status || 'Pending'}</span></p>
      `;
    }

    loadAdminDashboard();
  </script>
</body>
</html>
