<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Market Options — Admin Management</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; padding: 15px; font-size: 13px; }
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #1e293b; margin-bottom: 20px; }
    .brand { font-size: 18px; font-weight: bold; color: #38bdf8; }
    .status { color: #10b981; font-weight: 500; font-size: 12px; }
    .card { background: #151e32; border: 1px solid #1e293b; border-radius: 8px; padding: 15px; margin-bottom: 20px; overflow-x: auto; }
    .card-title { font-size: 14px; font-weight: bold; margin-bottom: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
    table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #1e293b; vertical-align: middle; }
    th { color: #64748b; font-size: 11px; text-transform: uppercase; }
    .action-btn { color: #38bdf8; background: none; border: none; cursor: pointer; text-decoration: none; font-size: 12px; margin-right: 8px; display: inline-block; font-weight: 500; }
    .action-btn:hover { text-decoration: underline; color: #7dd3fc; }
    .proton-btn { color: #a78bfa; background: #1e1b4b; border: 1px solid #4338ca; padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 11px; text-decoration: none; display: inline-block; }
    .proton-btn:hover { background: #312e81; color: #c4b5fd; }
    .email-btn { color: #38bdf8; background: #0b0f19; border: 1px solid #334155; padding: 6px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; cursor: pointer; text-align: left; }
    .email-btn:hover { background: #1e293b; }
    .management-panel { background: #151e32; border: 1px solid #1e293b; border-radius: 8px; padding: 15px; margin-top: 15px; }
    .form-group { margin-bottom: 12px; }
    .form-label { font-size: 11px; color: #94a3b8; margin-bottom: 4px; display: block; font-weight: 500; }
    .form-input { width: 100%; background: #0b0f19; border: 1px solid #334155; border-radius: 4px; padding: 8px; color: #fff; font-size: 13px; }
    .btn-main { width: 100%; background: #0284c7; color: #fff; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .btn-main:hover { background: #0369a1; }
    .btn-danger { width: 100%; background: #dc2626; color: #fff; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .btn-danger:hover { background: #b91c1c; }
    .doc-link { color: #38bdf8; display: inline-block; margin-right: 15px; font-size: 12px; text-decoration: underline; font-weight: 500; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">Global Market Options — Admin</div>
    <div class="status">● Connected (gmo.compliance@proton.me)</div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>User Email (Click to Inspect)</th>
          <th>Quick Actions</th>
        </tr>
      </thead>
      <tbody id="userTableBody">
        <tr>
          <td colspan="2" style="color:#94a3b8; text-align:center; padding: 20px;">Loading client records...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="management-panel" id="managementPanel">
    <div class="card-title">Client Management Panel</div>
    <div id="panelContent" style="color:#94a3b8; font-size: 12px;">
      Click any client email above or select an action to manage records here.
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://vhbxubqfgyxrkekyztay.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_328Qbegmks1uHjZlAEm14w_63T8Nk4f';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const ADMIN_PASSWORD = "1983";

    function verifyAdminAccess() {
      if (sessionStorage.getItem("admin_authenticated") === "true") return true;
      const pwd = prompt("🔐 Restricted Solo Admin Portal\nEnter Admin Password:");
      if (pwd === ADMIN_PASSWORD) {
        sessionStorage.setItem("admin_authenticated", "true");
        return true;
      }
      alert("❌ Access Denied");
      document.body.innerHTML = "<h2 style='color:red; text-align:center; margin-top:50px;'>403 - Unauthorized</h2>";
      return false;
    }

    if (!verifyAdminAccess()) throw new Error("Unauthorized");

    let cachedUsers = [];

    async function loadAdminDashboard() {
      const tableBody = document.getElementById('userTableBody');
      if (!tableBody) return;

      let { data: users, error } = await _supabase.from('profiles').select('*');

      if (error || !users || users.length === 0) {
        users = [
          { id: '1c144e8e-097b-4ad1-a172-05c039ce9', email: 'rosedgarcia89@gmail.com', full_name: 'Rosed Garcia', username: 'rosed89', country: 'United States', currency: 'USD', gender: 'Female', phone: '+15550192', password: 'samplepassword123' },
          { id: 'eab14bd8-8bf4-4948-804d-5b96a8ef', email: 'testclient@gmail.com', full_name: 'Test Client', username: 'testuser', country: 'United Kingdom', currency: 'EUR', gender: 'Male', phone: '+4420794609', password: 'testpassword456' }
        ];
      }

      cachedUsers = users;

      tableBody.innerHTML = users.map(user => {
        const email = user.email || '';
        const protonComposeUrl = `https://mail.proton.me/u/0/composer?to=${encodeURIComponent(email)}&subject=${encodeURIComponent("Global Market Options - Account Notification")}`;

        return `
        <tr>
          <td><button class="email-btn" onclick="selectClient('${user.id}')">📂 ${email || user.id}</button></td>
          <td>
            <button class="action-btn" onclick="openAction('Deposit', '${user.id}')">User Deposit</button>
            <button class="action-btn" onclick="openAction('KYC', '${user.id}')">Id Verification</button>
            <button class="action-btn" onclick="openAction('History', '${user.id}')">Update History</button>
            <button class="action-btn" onclick="openAction('Trade', '${user.id}')">Create Trade</button>
            <button class="action-btn" onclick="openAction('Withdraw', '${user.id}')">Withdraw Request</button>
            <button class="action-btn" onclick="openAction('TopUp', '${user.id}')">Top Up</button>
            <a class="proton-btn" href="${protonComposeUrl}" target="_blank">✉️ Notify via Proton</a>
          </td>
        </tr>
      `;
      }).join('');
    }

    function selectClient(userId) {
      const user = cachedUsers.find(u => u.id === userId) || {};
      const panel = document.getElementById('panelContent');
      const email = user.email || '';

      panel.innerHTML = `
        <div class="form-group"><label class="form-label">ID (Do not change)</label><input class="form-input" value="${user.id || userId}" readonly style="color:#94a3b8; background:#070a12;"></div>
        <div class="form-group"><label class="form-label">Full Name</label><input class="form-input" value="${user.full_name || user.name || 'N/A'}" readonly></div>
        <div class="form-group"><label class="form-label">Username</label><input class="form-input" value="${user.username || 'N/A'}" readonly></div>
        <div class="form-group"><label class="form-label">Client Email</label><input class="form-input" value="${email}" readonly></div>
        <div class="form-group"><label class="form-label">Country</label><input class="form-input" value="${user.country || 'N/A'}" readonly></div>
        <div class="form-group"><label class="form-label">Select Currency</label><input class="form-input" value="${user.currency || 'N/A'}" readonly></div>
        <div class="form-group"><label class="form-label">Gender</label><input class="form-input" value="${user.gender || 'N/A'}" readonly></div>
        <div class="form-group"><label class="form-label">Phone Number</label><input class="form-input" value="${user.phone || user.phone_number || 'N/A'}" readonly></div>
        <div class="form-group"><label class="form-label">Password</label><input class="form-input" value="${user.password || 'N/A'}" readonly style="color:#38bdf8;"></div>
      `;
    }

    async function openAction(type, userId) {
      selectClient(userId);
      const panel = document.getElementById('panelContent');
      const user = cachedUsers.find(u => u.id === userId) || {};

      if (type === 'KYC') {
        let { data: kycData } = await _supabase.from('kyc_records').select('*').eq('user_id', userId).maybeSingle();
        
        const doc1 = kycData?.document_1 || kycData?.id_front || '#';
        const doc2 = kycData?.document_2 || kycData?.id_back || '#';
        const kycStatus = kycData?.status || 'Pending Verification';

        panel.innerHTML += `
          <hr style="border:0; border-top:1px solid #334155; margin: 15px 0;">
          <div class="card-title" style="color:#38bdf8;">KYC Verification Management — ${user.email}</div>
          <div class="form-group">
            <label class="form-label">Verification Status:</label>
            <select class="form-input" id="statusVal">
              <option value="Successful" ${kycStatus === 'Successful' ? 'selected' : ''}>Successful (Verified)</option>
              <option value="Pending" ${kycStatus === 'Pending' ? 'selected' : ''}>Pending</option>
              <option value="Action Required" ${kycStatus === 'Action Required' ? 'selected' : ''}>Action Required / Rejected</option>
            </select>
          </div>
          <div style="margin: 15px 0; background: #070a12; padding: 12px; border-radius: 6px; border: 1px solid #334155;">
            <div class="form-label" style="margin-bottom:8px; color:#38bdf8;">Submitted Identification Documents:</div>
            <a href="${doc1}" target="_blank" class="doc-link">📄 View Document 1 (Front ID / Passport)</a><br><br>
            <a href="${doc2}" target="_blank" class="doc-link">📄 View Document 2 (Back ID / Proof of Address)</a>
          </div>
          <button class="btn-main" onclick="alert('KYC verification status successfully updated for ${user.email}!')">Update KYC Record</button>
          <button class="btn-danger" onclick="alert('KYC records reset successfully')">Delete Records</button>
        `;
      } else {
        panel.innerHTML += `
          <hr style="border:0; border-top:1px solid #334155; margin: 15px 0;">
          <div class="card-title" style="color:#38bdf8;">Manage: ${type} (${user.email})</div>
          
          <div class="form-group">
            <label class="form-label">Select Account Balance Section:</label>
            <select class="form-input" id="balanceSection">
              <option value="Main Balance">Main Balance</option>
              <option value="Deposit">Deposit</option>
              <option value="Withdraw">Withdraw</option>
              <option value="Bonus">Bonus</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Enter Amount / Details</label>
            <input class="form-input" id="actionVal" placeholder="Enter amount or details for ${type}">
          </div>

          <div class="form-group">
            <label class="form-label">Status:</label>
            <select class="form-input" id="statusVal">
              <option value="Successful">Successful</option>
              <option value="Pending">Pending</option>
              <option value="Action Required">Action Required</option>
            </select>
          </div>

          <button class="btn-main" onclick="alert('${type} updated successfully for ' + document.getElementById('balanceSection').value + '!')">Submit ${type.toUpperCase()}</button>
          <button class="btn-danger" onclick="alert('Record deleted successfully')">Delete</button>
        `;
      }
    }

    loadAdminDashboard();
  </script>
</body>
</html>
