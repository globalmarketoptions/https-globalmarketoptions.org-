<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo Admin Dashboard - Global Market Options</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; padding: 20px; font-size: 14px; }
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid #1e293b; margin-bottom: 24px; }
    .brand { font-size: 20px; font-weight: bold; color: #38bdf8; }
    .container { max-width: 1200px; margin: 0 auto; }
    .card { background-color: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 20px; margin-bottom: 24px; overflow-x: auto; }
    h2 { font-size: 16px; margin-bottom: 16px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 12px; border-bottom: 1px solid #374151; color: #9ca3af; font-size: 12px; }
    td { padding: 12px; border-bottom: 1px solid #1f2937; }
    a.action-link { color: #38bdf8; text-decoration: none; margin-right: 12px; font-size: 13px; font-weight: 500; display: inline-block; }
    a.action-link:hover { text-decoration: underline; color: #7dd3fc; }
    a.email-btn { color: #10b981; font-weight: 600; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; }
    .badge-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge-approved { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .btn { padding: 8px 16px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 10px; }
    .btn:hover { background: #1d4ed8; }
    input, select { padding: 8px; background: #030712; border: 1px solid #374151; color: #fff; border-radius: 4px; margin-bottom: 10px; width: 100%; max-width: 300px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="brand">Global Market Options — Admin Management</div>
    <div id="adminStatus">Connected to Live Database</div>
  </div>

  <!-- Registered Users Control Panel -->
  <div class="card">
    <h2>Registered Clients & Quick Actions</h2>
    <table>
      <thead>
        <tr>
          <th>User Email</th>
          <th>Quick Actions</th>
        </tr>
      </thead>
      <tbody id="userTableBody">
        <tr><td colspan="2" style="color: #6b7280;">Loading client records...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Verification Document Review Modal/Section -->
  <div class="card" id="verificationSection">
    <h2>KYC & ID Verification Status</h2>
    <div id="kycContent">Select "Id Verification" on a client above to manage documents.</div>
  </div>
</div>

<script>
  // 1. Initialize Supabase (Replace with your actual Supabase URL & Anon Key)
  const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_ID.supabase.co';
  const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function loadAdminDashboard() {
    const tableBody = document.getElementById('userTableBody');
    
    // Fetch profiles from public.profiles
    const { data: users, error } = await _supabase.from('profiles').select('*');

    if (error || !users || users.length === 0) {
      tableBody.innerHTML = '<tr><td colspan="2" style="color: #ef4444;">No users found or database connection error.</td></tr>';
      return;
    }

    tableBody.innerHTML = '';
    users.forEach(user => {
      const email = user.email || 'No email registered';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="color: #38bdf8; font-weight: 500;">${email}</td>
        <td>
          <a class="action-link" href="#" onclick="viewUserDeposits('${user.id}')">User Deposit</a>
          <a class="action-link" href="#" onclick="viewIdVerification('${user.id}', '${email}')">Id Verification</a>
          <a class="action-link" href="#" onclick="viewHistory('${user.id}')">Update History</a>
          <a class="action-link" href="#" onclick="createTrade('${user.id}')">Create Trade</a>
          <a class="action-link" href="#" onclick="viewWithdrawals('${user.id}')">Withdraw Request</a>
          <a class="action-link" href="#" onclick="topUpUser('${user.id}')">Top Up</a>
          <a class="action-link email-btn" href="mailto:${email}?subject=Notice%20from%20Global%20Market%20Options">✉ Email Client</a>
        </td>
      `;
      tableBody.appendChild(tr);
    });
  }

  // Action Handlers
  async function viewIdVerification(userId, email) {
    const kycBox = document.getElementById('kycContent');
    kycBox.innerHTML = 'Fetching verification details...';

    const { data: kyc } = await _supabase.from('kyc_records').select('*').eq('user_id', userId).single();

    if (!kyc) {
      kycBox.innerHTML = `<p style="color:#94a3b8;">No ID submitted for <strong>${email}</strong> yet.</p>`;
      return;
    }

    kycBox.innerHTML = `
      <div style="max-width: 500px;">
        <p><strong>User:</strong> ${email}</p>
        <p style="margin-top: 8px;"><strong>Status:</strong> <span class="badge badge-pending">${kyc.status}</span></p>
        <div style="margin: 12px 0;">
          <a href="${kyc.document_path || '#'}" target="_blank" style="color: #38bdf8; text-decoration: underline;">View Document 1</a>
        </div>
        <label>Update Status:</label>
        <select id="kycStatusSelect">
          <option value="APPROVED" ${kyc.status === 'APPROVED' ? 'selected' : ''}>Approved / Successful</option>
          <option value="UNDER_REVIEW" ${kyc.status === 'UNDER_REVIEW' ? 'selected' : ''}>Under Review</option>
          <option value="REJECTED" ${kyc.status === 'REJECTED' ? 'selected' : ''}>Rejected</option>
        </select>
        <button class="btn" onclick="updateKycStatus('${kyc.id}')">Update Status</button>
      </div>
    `;
  }

  async function updateKycStatus(kycId) {
    const newStatus = document.getElementById('kycStatusSelect').value;
    await _supabase.from('kyc_records').update({ status: newStatus }).eq('id', kycId);
    alert('KYC Status updated successfully!');
  }

  function createTrade(userId) {
    const amount = prompt("Enter Trade Amount ($):");
    if (amount) {
      _supabase.from('trades').insert([{ user_id: userId, amount: parseFloat(amount), status: 'IN_PROGRESS' }])
        .then(() => alert('Trade Created Successfully!'));
    }
  }

  function topUpUser(userId) {
    const amount = prompt("Enter Top Up Amount ($):");
    if (amount) {
      _supabase.from('transactions').insert([{ user_id: userId, type: 'DEPOSIT', amount: parseFloat(amount), currency: 'USD', status: 'COMPLETED' }])
        .then(() => alert('Account Topped Up!'));
    }
  }

  // Initial Load
  loadAdminDashboard();
</script>

</body>
</html>
