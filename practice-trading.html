<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice Trading | Global Market Options</title>
  <style>
    body { background-color: #0b0f19; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; text-align: center; }
    .card { background: #111827; border-radius: 12px; padding: 30px; max-width: 480px; margin: 40px auto; border: 1px solid #1f2937; text-align: left; }
    .title { font-size: 22px; font-weight: bold; margin-bottom: 6px; color: #f9fafb; }
    .subtitle { font-size: 14px; color: #9ca3af; margin-bottom: 24px; line-height: 1.5; }
    .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #6b7280; font-weight: 600; margin-bottom: 6px; }
    .balance { font-size: 32px; color: #10b981; font-weight: bold; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    select, input { width: 100%; padding: 12px; background-color: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 15px; box-sizing: border-box; }
    .btn-submit { background: #059669; color: #fff; border: none; padding: 14px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    .btn-submit:hover { background: #10b981; }
    
    /* Execution Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 9999; }
    .modal-content { background: #1f2937; padding: 30px; border-radius: 12px; max-width: 400px; width: 90%; text-align: center; border: 1px solid #374151; }
    .spinner { border: 4px solid #374151; border-top: 4px solid #10b981; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .status-text { color: #38bdf8; font-size: 15px; font-weight: 500; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="label">PRACTICE TRADING WORKSPACE</div>
    <div class="title">Institutional Signal Execution</div>
    <div class="subtitle">Execute real-time algorithmic trades using high-frequency institutional signal feeds. Test execution speed, leverage entries, and live position management.</div>

    <div class="label">AVAILABLE PRACTICE BALANCE</div>
    <div class="balance" id="practiceBalance">$110.00</div>

    <div class="form-group">
      <div class="label">MARKET</div>
      <select id="marketSelect">
        <option value="BTC/USD">BTC/USD</option>
        <option value="ETH/USD">ETH/USD</option>
        <option value="EUR/USD">EUR/USD</option>
        <option value="NASDAQ:AAPL">AAPL / USD</option>
      </select>
    </div>

    <div class="form-group">
      <div class="label">ORDER TYPE</div>
      <select>
        <option value="Buy">Buy / Long</option>
        <option value="Sell">Sell / Short</option>
      </select>
    </div>

    <div class="form-group">
      <div class="label">PRACTICE ORDER AMOUNT (USD)</div>
      <input type="number" value="10" id="orderAmount">
    </div>

    <button class="btn-submit" onclick="startSignalExecution()">Place Practice Trade</button>
  </div>

  <!-- Signal Execution & Result Modal -->
  <div class="modal" id="signalModal">
    <div class="modal-content" id="modalBody">
      <!-- Dynamic signal execution steps will load here -->
    </div>
  </div>

  <script>
    function startSignalExecution() {
      const modal = document.getElementById('signalModal');
      const body = document.getElementById('modalBody');
      const market = document.getElementById('marketSelect').value;
      modal.style.display = 'flex';

      // Step 1: Analyzing Signal
      body.innerHTML = `
        <h3 style="color: #f9fafb;">Analyzing Market Order...</h3>
        <div class="spinner"></div>
        <p class="status-text">Scanning High-Frequency Signal Matrix for ${market}...</p>
      `;

      // Step 2: Routing Order
      setTimeout(() => {
        body.innerHTML = `
          <h3 style="color: #f9fafb;">Routing Order to Liquidity</h3>
          <div class="spinner"></div>
          <p class="status-text">Matching Signal Order at Best Market Bid/Ask...</p>
        `;
      }, 1500);

      // Step 3: Trade Success
      setTimeout(() => {
        document.getElementById('practiceBalance').innerText = "$210.00";
        body.innerHTML = `
          <h3 style="color: #10b981; font-size: 24px;">🎉 Trade Signal Executed!</h3>
          <p style="font-size: 20px; font-weight: bold; color: #f9fafb; margin: 15px 0;">+$100.00 Profit Realized</p>
          <p style="color: #9ca3af; font-size: 14px; line-height: 1.5;">Your practice position hit target TP. Top up your live trading account to apply these signal strategies on real funds.</p>
          <button class="btn-submit" onclick="window.location.href='/dashboard.html'" style="margin-top: 15px;">Top Up Account Now</button>
        `;
      }, 3200);
    }
  </script>

  <!-- Tawk.to Live Chat -->

    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();

    var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];

    s1.charset='UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1,0);
    })();
  </script>
</body>
</html>
