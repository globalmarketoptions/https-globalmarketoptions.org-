<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Global Market Options</title>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #000000; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .login-container { width: 100%; max-width: 420px; background: #000000; border: 1px solid #1f2937; border-radius: 12px; padding: 32px; }
    .login-header { text-align: center; margin-bottom: 24px; }
    .login-header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .login-header p { font-size: 14px; color: #9ca3af; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 14px; color: #d1d5db; margin-bottom: 8px; }
    .form-control { width: 100%; padding: 12px 14px; background-color: #0b0f19; border: 1px solid #374151; border-radius: 6px; font-size: 15px; color: #ffffff; outline: none; }
    .form-control:focus { border-color: #10b981; }
    
    /* Password field with eye toggle */
    .password-wrapper { position: relative; width: 100%; }
    .password-wrapper .form-control { padding-right: 42px; }
    .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #9ca3af; display: flex; align-items: center; justify-content: center; background: none; border: none; padding: 0; }
    .toggle-password:hover { color: #ffffff; }
    .toggle-password svg { width: 20px; height: 20px; }

    .btn-submit { width: 100%; padding: 14px; background-color: #059669; color: #ffffff; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-submit:hover { background-color: #047857; }
    .error-msg { background: #7f1d1d; color: #fca5a5; padding: 10px; border-radius: 6px; font-size: 14px; margin-bottom: 16px; display: none; text-align: center; }
    .auth-link { text-align: center; margin-top: 20px; font-size: 14px; color: #9ca3af; }
    .auth-link a { color: #10b981; text-decoration: none; }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <h1>Access your account</h1>
      <p>Sign in securely to access your account.</p>
    </div>

    <div id="error-box" class="error-msg">Invalid credentials or account does not exist.</div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="login-email" class="form-control" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
          <button type="button" class="toggle-password" onclick="togglePassword('login-password', this)" aria-label="Toggle password visibility">
            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="btn-submit" class="btn-submit">Sign In</button>
    </form>

    <div class="auth-link">
      Don't have an account? <a href="/register.html">Register</a>
    </div>
  </div>

  <script>
    // Initialize Supabase Client
    const SUPABASE_URL = 'https://vhbxubqfgyxrkekyztay.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_328Qbegmks1uHjZlAEm14w_63T8Nk4f';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Password Visibility Toggle
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === "password";
      input.type = isPassword ? "text" : "password";

      btn.innerHTML = isPassword ? `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      ` : `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      `;
    }

    // Handle Supabase Login Authentication
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.toLowerCase().trim();
      const password = document.getElementById('login-password').value;
      const errorBox = document.getElementById('error-box');
      const submitBtn = document.getElementById('btn-submit');

      errorBox.style.display = 'none';
      submitBtn.innerText = 'Signing In...';
      submitBtn.disabled = true;

      try {
        const { data, error } = await _supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          errorBox.innerText = error.message.includes('Invalid') ? 'Invalid credentials or account does not exist.' : error.message;
          errorBox.style.display = 'block';
          submitBtn.innerText = 'Sign In';
          submitBtn.disabled = false;
          return;
        }

        // Successfully logged in
        window.location.href = '/dashboard.html';

      } catch (err) {
        errorBox.innerText = 'An unexpected error occurred. Please try again.';
        errorBox.style.display = 'block';
        submitBtn.innerText = 'Sign In';
        submitBtn.disabled = false;
      }
    });
  </script>

</html>
