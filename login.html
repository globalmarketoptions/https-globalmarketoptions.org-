<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Global Market Options</title>
    <script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between">
    <div class="max-w-md w-full mx-auto p-6 my-auto bg-slate-900 border border-slate-800 rounded-2xl shadow-xl">
        <h1 class="text-2xl font-bold mb-2">Access your account</h1>
        <p class="text-slate-400 mb-6 text-sm">Sign in securely to access your account.</p>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-300 mb-1">Email address</label>
                <input type="email" id="email" required placeholder="you@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-1">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" required placeholder="••••••••" style="width: 100%; padding-right: 40px;" class="bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
                    <button type="button" onclick="const p=document.getElementById('password'); p.type=p.type==='password'?'text':'password';" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #9ca3af; cursor: pointer;">👁</button>
                </div>
            </div>
            
            <button type="submit" id="login-submit" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold rounded-lg transition-colors">
                Sign In
            </button>
        </form><p id="login-status" role="status" aria-live="polite" class="text-sm text-slate-400 mt-4"></p><p class="text-sm text-slate-400 mt-4">New here? <a class="text-emerald-400 underline" href="/register">Create Account</a></p>
    </div>

    <footer class="text-center py-6 text-xs text-slate-500">
        © 2005 Global Market Options
    </footer>
<script>
(() => {
 const form=document.getElementById("login-form"), status=document.getElementById("login-status"), button=document.getElementById("login-submit");
 const config=window.SUPABASE_CONFIG||{};
 const ready=Boolean(window.supabase&&config.url&&config.anonKey&&!String(config.url).includes("YOUR_")&&!String(config.anonKey).includes("YOUR_"));
 const client=ready?window.supabase.createClient(config.url,config.anonKey):null;
 form.addEventListener("submit",async event=>{
  event.preventDefault();
  if(!form.reportValidity())return;
  if(!client){status.textContent="Sign-in service is not configured. Please try again later.";return;}
  button.disabled=true;status.textContent="Signing in…";
  try{
   const result=await client.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});
   if(result.error)throw result.error;
   if(!result.data||!result.data.session)throw new Error("No authenticated session was returned.");
   window.location.assign("/dashboard");
  }catch(_){status.textContent="Unable to sign in. Check your email and password, then try again.";}
  finally{button.disabled=false;}
 });
})();
</script><script src="/tawk-chat.js" defer></script>
</body>
</html>
