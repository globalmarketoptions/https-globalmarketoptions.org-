<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Global Market Options</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #000000; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .login-container { width: 100%; max-width: 420px; background: #000000; border: 1px solid #1f2937; border-radius: 12px; padding: 32px; }
    .login-header { text-align: center; margin-bottom: 24px; }
    .login-header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .login-header p { font-size: 14px; color: #9ca3af; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 14px; color: #d1d5db; margin-bottom: 8px; }
    .form-control { width: 100%; padding: 12px 14px; background-color: #0b0f19; border: 1px solid #374151; border-radius: 6px; font-size: 15px; color: #ffffff; outline: none; }
    .form-control:focus { border-color: #10b981; }
    .btn-submit { width: 100%; padding: 14px; background-color: #059669; color: #ffffff; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-submit:hover { background-color: #047857; }
    .error-msg { background: #7f1d1d; color: #fca5a5; padding: 10px; border-radius: 6px; font-size: 14px; margin-bottom: 16px; display: none; text-align: center; }
    .auth-link { text-align: center; margin-top: 20px; font-size: 14px; color: #9ca3af; }
    .auth-link a { color: #10b981; text-decoration: none; }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <h1>Access your account</h1>
      <p>Sign in securely to access your account.</p>
    </div>

    <div id="error-box" class="error-msg">Invalid credentials or account does not exist.</div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="login-email" class="form-control" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <div class="auth-link">
      Don't have an account? <a href="/register.html">Register</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.toLowerCase().trim();
      const password = document.getElementById('login-password').value;
      const errorBox = document.getElementById('error-box');

      // Check registered accounts in local database
      const registeredUsers = JSON.parse(localStorage.getItem('gmo_users') || '[]');
      const user = registeredUsers.find(u => u.email === email && u.password === password);

      if (user) {
        errorBox.style.display = 'none';
        localStorage.setItem('gmo_current_user', JSON.stringify(user));
        alert('Login successful! Redirecting...');
        window.location.href = '/dashboard.html';
      } else {
        errorBox.innerText = "Invalid credentials or account does not exist.";
        errorBox.style.display = 'block';
      }
    });
  </script>

</body>
</html>
