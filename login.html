<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220">
<title>Access Your Account | Global Market Options</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111b2d;--line:#25334a;--text:#f3f6fc;--muted:#9caec6;--accent:#64e5b1}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#15352f 0,transparent 45%),var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,sans-serif}a{color:inherit}.wrap{width:min(1080px,calc(100% - 32px));margin:auto}
header{border-bottom:1px solid var(--line)}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{font-weight:900;text-decoration:none}.links{display:flex;gap:16px;flex-wrap:wrap}.links a{text-decoration:none;color:var(--muted);font-size:.9rem}
main{display:grid;place-items:center;padding:52px 0}.panel{width:min(480px,100%);padding:28px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 24px 60px #0003}h1{margin:0;font-size:2rem;letter-spacing:-.04em}.muted{color:var(--muted)}
label{display:block;margin:18px 0 8px;font-size:.9rem;font-weight:700}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;background:#0b1220;color:var(--text);font:inherit}.password-field{position:relative;display:block;width:100%}.password-field input{width:100%;padding-right:40px}.password-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:2;background:transparent;border:none;width:auto;margin:0;padding:4px;color:#9ca3af;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.password-toggle:hover,.password-toggle:focus-visible{background:transparent;color:#f3f6fc;outline:2px solid var(--accent);outline-offset:2px}.password-toggle svg{width:18px;height:18px;display:block}
button{position:relative;z-index:1;pointer-events:auto;width:100%;margin-top:12px;padding:13px;border:0;border-radius:9px;background:var(--accent);color:#071a14;font:inherit;font-weight:800;cursor:pointer}button.secondary{background:#19263b;color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:not-allowed}
#status{min-height:48px;margin:16px 0 0;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}.notice{font-size:.82rem;color:var(--muted);margin-top:18px}footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:.85rem}.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:520px){main{padding:28px 0}.panel{padding:22px}.links{gap:10px}}
</style><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="wrap nav"><a class="brand" href="/index.html">GLOBAL MARKET OPTIONS</a><nav class="links" aria-label="Main navigation"><a href="/index.html">Markets</a><a href="/crude-oil.html">Crude Oil</a><a href="/real-estate.html">Real Estate</a></nav></div></header>
<main class="wrap"><section class="panel" aria-labelledby="login-title">
<h1 id="login-title">Access your account</h1><p id="auth-intro" class="muted">Sign in securely to access your account.</p>
<button id="google-sign-in" type="button">Continue with Google or create account</button><div aria-hidden="true" class="muted" style="text-align:center;margin:14px 0">or use email</div>
<form id="email-form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required><label for="password">Password</label><span class="password-field"><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button id="password-toggle" class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" title="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></span><a class="auth-inline-link" href="/reset-password.html">Reset Password</a><button id="password-submit" type="submit">Sign In</button></form><p id="status" role="status" aria-live="polite"></p><p class="auth-switch">New member? <a href="/register">Create an account</a></p>


</section></main>
<footer><div class="wrap foot"><span>© 2005 Global Market Options</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script>
<script>
(() => {
 const status=document.getElementById("status");
 const google=document.getElementById("google-sign-in");
 const form=document.getElementById("email-form");
 const passwordInput=document.getElementById("password");
 const toggle=document.getElementById("password-toggle");
 toggle.addEventListener("click",()=>{
   const showing=passwordInput.type==="password";
   passwordInput.type=showing?"text":"password";
   toggle.setAttribute("aria-pressed",String(showing));
   toggle.setAttribute("aria-label",showing?"Hide password":"Show password");
   toggle.setAttribute("title",showing?"Hide password":"Show password");
 });
 const config=window.SUPABASE_CONFIG||{};
 const ready=Boolean(window.supabase&&config.url&&config.anonKey&&!config.url.includes("YOUR_")&&!config.anonKey.includes("YOUR_"));
 const client=ready?window.supabase.createClient(config.url,config.anonKey):null;
 google.addEventListener("click",async()=>{
   if(!client){status.textContent="Please check your connection and try again.";return;}
   google.disabled=true;status.textContent="Connecting to Google…";
   try{
     const result=await client.auth.signInWithOAuth({provider:"google",options:{redirectTo:window.location.origin+"/login"}});
     if(result.error)throw result.error;
   }catch(error){status.textContent="Google sign-in could not start. Please try again later.";google.disabled=false;}
 });
 form.addEventListener("submit",async event=>{
   event.preventDefault();
   if(!form.reportValidity())return;
   const email=document.getElementById("email").value.trim();
   const password=passwordInput.value;
   const button=document.getElementById("password-submit");
   if(!client){status.textContent="Please check your connection and try again.";return;}
   button.disabled=true;status.textContent="Signing in…";
   try{
     const result=await client.auth.signInWithPassword({email,password});
     if(result.error)throw result.error;
     if(result.data&&result.data.session){status.textContent="Signed in. Opening your dashboard…";window.location.assign("/dashboard");}
     else{status.textContent="Sign-in did not return an authenticated session. Please try again.";}
   }catch(error){status.textContent="Unable to sign in with those details. Check your email and password, or reset your password.";}
   finally{button.disabled=false;}
 });
 if(client)client.auth.onAuthStateChange((_event,session)=>{if(session){window.location.replace("/dashboard");}});
})();
</script></body></html>
