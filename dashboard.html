<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Wallet Dashboard | Global Market Options</title>
<style>
:root{color-scheme:light;--bg:#f6f8fc;--panel:#fff;--line:#e7eaf2;--text:#20243a;--muted:#7d8298;--purple:#6d3de7;--purple-dark:#5226c9;--cyan:#19c5e8;--shadow:0 12px 35px rgba(38,35,78,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a{font:inherit}a{color:inherit;text-decoration:none}button{cursor:pointer}.shell{max-width:1160px;margin:auto;padding:0 24px}header{background:#fff;border-bottom:1px solid var(--line)}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:-.03em;font-size:1.08rem}.logo{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#8d65ff,#5d2fd6);color:#fff;font-weight:900;font-size:1.05rem;box-shadow:0 5px 12px #6d3de733}.top-actions{display:flex;align-items:center;gap:13px}.connect{border:0;border-radius:999px;background:var(--purple);color:white;padding:10px 22px;font-weight:750;box-shadow:0 6px 14px #6d3de72b}.search{height:42px;width:42px;display:grid;place-items:center;border:1px solid var(--line);background:#fff;border-radius:50%;color:#4e5269}.notice{margin:24px 0 28px;background:#e1faff;border:1px solid #b7f1fb;color:#167c96;padding:13px 17px;border-radius:10px;display:flex;align-items:center;gap:10px}.notice-x{font-size:1.2rem;font-weight:800}.notice strong{font-weight:750}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:24px}h1{font-size:clamp(1.8rem,4vw,2.35rem);letter-spacing:-.045em;line-height:1.15;margin:0 0 18px;font-weight:850}.tabs{display:flex;gap:10px;flex-wrap:wrap}.tab{border:1px solid var(--purple);border-radius:9px;padding:10px 17px;font-weight:750;background:#fff;color:var(--purple)}.tab.active{background:var(--purple);color:#fff;box-shadow:0 6px 15px #6d3de72c}.balance-panel{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:26px 28px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:22px}.eyebrow{font-size:.92rem;color:var(--muted);font-weight:650}.balance-line{display:flex;align-items:center;gap:17px;flex-wrap:wrap}.balance{font-size:clamp(2rem,5vw,2.9rem);letter-spacing:-.055em;line-height:1.2;font-weight:850;margin-top:6px}.topup{border:1px solid #b9a6fb;background:#fff;color:var(--purple);border-radius:9px;padding:10px 17px;font-weight:750}.topup:hover,.tab:not(.active):hover{background:#f5f1ff}.deposit-card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:25px 28px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;min-height:230px}.deposit-card h2{font-size:1.12rem;margin:0 0 10px}.deposit-amount{font-size:clamp(1.8rem,4vw,2.35rem);font-weight:850;letter-spacing:-.04em}.daily{color:#8b8fa2;font-size:.9rem;margin-top:8px}.daily .arrow{color:#23a878;font-weight:900;margin-right:5px}.ring-wrap{width:148px;height:148px;display:grid;place-items:center;position:relative}.ring{--p:0;width:136px;height:136px;border-radius:50%;background:conic-gradient(var(--purple) calc(var(--p)*1%),#eee9fb 0);display:grid;place-items:center;position:relative;transition:background .2s linear}.ring:before{content:"";position:absolute;inset:10px;background:#fff;border-radius:50%}.ring-label{position:relative;text-align:center;font-size:1.15rem;font-weight:850;color:var(--purple)}.ring-label small{display:block;font-size:.67rem;color:#9691aa;font-weight:650;letter-spacing:.04em}.bottom-nav{position:fixed;z-index:10;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:space-around;gap:6px;width:min(560px,calc(100% - 28px));padding:10px 13px;background:linear-gradient(110deg,#7143e9,#5728cc);border-radius:18px;box-shadow:0 12px 32px #5426bc45;color:#fff}.nav-action{min-width:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:transparent;border:0;color:#fff;border-radius:11px;padding:5px 9px;font-size:.68rem;font-weight:650;opacity:.94}.nav-action:hover,.nav-action:focus-visible{background:#ffffff25;outline:none}.nav-icon{font-size:1.25rem;line-height:1.2}.flag{font-size:1.28rem}.spacer-bottom{height:110px}.toast{display:none;margin:14px 0 0;padding:10px 13px;border-radius:9px;background:#f2edff;color:#4e2aa9;font-size:.9rem}.toast.show{display:block}.dark{--bg:#171526;--panel:#211e34;--line:#39344d;--text:#f4f1ff;--muted:#b5afc9;--shadow:0 12px 35px #0003}.dark header,.dark .balance-panel,.dark .deposit-card,.dark .search,.dark .topup,.dark .tab:not(.active){background:var(--panel);color:var(--text);border-color:var(--line)}.dark .ring:before{background:var(--panel)}.dark .notice{background:#18353d;border-color:#27535d;color:#a6effa}.dark .ring{background:conic-gradient(var(--purple) calc(var(--p)*1%),#393149 0)}@media(max-width:620px){.shell{padding:0 16px}.topbar{height:68px}.brand{font-size:.94rem}.logo{width:35px;height:35px}.connect{padding:9px 15px}.notice{margin:18px 0 24px}.balance-panel{padding:21px 19px}.deposit-card{padding:22px 19px;grid-template-columns:1fr;gap:10px}.ring-wrap{margin:0 auto}.bottom-nav{bottom:12px}.nav-action{min-width:45px;padding:6px 5px}.nav-icon{font-size:1.15rem}}
</style>
</head>
<body>
<header><div class="shell topbar">
<a class="brand" href="/dashboard" aria-label="Global Market Options home"><span class="logo">G</span><span>GLOBAL MARKET OPTIONS</span></a>
<div class="top-actions"><button class="connect" id="connect-button" type="button">Connect</button><button class="search" id="search-button" type="button" aria-label="Search"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button></div>
</div></header>
<main class="shell">
<div class="notice" role="status"><span class="notice-x" aria-hidden="true">×</span><span id="welcome-message"><strong>Welcome!</strong> You are viewing your wallet dashboard.</span></div>
<section class="page-head"><div><h1>Wallet Dashboard</h1><div class="tabs"><button class="tab active" id="liquidity-tab" type="button">+ Liquidity</button><button class="tab" id="history-tab" type="button">Trade History</button></div></div></section>
<section class="balance-panel" aria-labelledby="total-label"><div><div class="eyebrow" id="total-label">Total Balance</div><div class="balance-line"><div class="balance" id="total-balance">€0.00 / US$0.00</div></div></div><button class="topup" id="topup-button" type="button">+ Top Up</button></section>
<section class="deposit-card" aria-labelledby="deposited-title"><div><h2 id="deposited-title">Deposited</h2><div class="deposit-amount" id="deposited-balance">€0.00 / US$0.00</div><div class="daily"><span class="arrow">↗</span>10 Percent (Daily Limit)</div></div><div class="ring-wrap"><div class="ring" id="progress-ring" role="img" aria-label="Progress 0 percent"><div class="ring-label"><span id="progress-value">00.0%</span><small>PROGRESS</small></div></div></div></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="spacer-bottom"></div>
</main>
<nav class="bottom-nav" aria-label="Dashboard tools">
<button class="nav-action" id="theme-toggle" type="button" aria-label="Toggle theme"><span class="nav-icon">◐</span><span>Theme</span></button>
<button class="nav-action" id="country-toggle" type="button" aria-label="Select country"><span class="nav-icon flag" id="country-flag">🇳🇱</span><span>Country</span></button>
<button class="nav-action" id="menu-button" type="button" aria-label="Menu"><span class="nav-icon">☰</span><span>Menu</span></button>
<button class="nav-action" id="notifications-button" type="button" aria-label="Notifications"><span class="nav-icon">♧</span><span>Alerts</span></button>
<button class="nav-action" id="chat-button" type="button" aria-label="Chat"><span class="nav-icon">▤</span><span>Chat</span></button>
</nav>
<script>
(() => {
 const $ = id => document.getElementById(id);
 const toast = message => { const el=$('toast'); el.textContent=message; el.classList.add('show'); };
 // Balances default to zero. Only a trusted account API should ever replace these display values.
 $('total-balance').textContent='€0.00 / US$0.00';
 $('deposited-balance').textContent='€0.00 / US$0.00';
 // Resolve the welcome name from an existing authenticated Supabase session when available.
 async function setWelcome(){
   try {
     const cfg=window.SUPABASE_CONFIG||{};
     if(window.supabase && cfg.url && cfg.anonKey && !String(cfg.url).includes('YOUR_') && !String(cfg.anonKey).includes('YOUR_')){
       const client=window.supabase.createClient(cfg.url,cfg.anonKey);
       const result=await client.auth.getUser();
       const user=result && result.data && result.data.user;
       if(user){const name=(user.user_metadata && (user.user_metadata.full_name || user.user_metadata.name)) || user.email || 'Account holder'; $('welcome-message').textContent='You are logged in as '+name+'!'; return;}
     }
   } catch (_) {}
   $('welcome-message').textContent='Welcome to your wallet dashboard!';
 }
 setWelcome();
 // A seven-day visual progress indicator only; it never changes balances or enables financial actions.
 const key='gmo-wallet-progress-start-v1';
 let started=Number(localStorage.getItem(key));
 if(!Number.isFinite(started)||started<=0){started=Date.now();localStorage.setItem(key,String(started));}
 const duration=7*24*60*60*1000;
 function updateProgress(){const pct=Math.max(0,Math.min(100,(Date.now()-started)/duration*100));$('progress-ring').style.setProperty('--p',pct.toFixed(3));$('progress-value').textContent=(pct<10?'0':'')+pct.toFixed(1)+'%';$('progress-ring').setAttribute('aria-label','Progress '+pct.toFixed(1)+' percent');}
 updateProgress();setInterval(updateProgress,60000);
 $('connect-button').addEventListener('click',()=>toast('Connect your account using the secure sign-in flow.'));
 $('search-button').addEventListener('click',()=>toast('Search is not available on this dashboard yet.'));
 $('liquidity-tab').addEventListener('click',()=>{ $('liquidity-tab').classList.add('active');$('history-tab').classList.remove('active');toast('Liquidity overview selected.'); });
 $('history-tab').addEventListener('click',()=>{ $('history-tab').classList.add('active');$('liquidity-tab').classList.remove('active');toast('Trade history is not available to display yet.'); });
 $('topup-button').addEventListener('click',()=>{window.location.assign('/deposit');});
 $('theme-toggle').addEventListener('click',()=>document.body.classList.toggle('dark'));
 const flags=['🇳🇱','🇬🇧','🇺🇸','🇩🇪','🇫🇷'];let flagIndex=0;
 $('country-toggle').addEventListener('click',()=>{flagIndex=(flagIndex+1)%flags.length;$('country-flag').textContent=flags[flagIndex];});
 $('menu-button').addEventListener('click',()=>toast('Menu options are not available on this dashboard yet.'));
 $('notifications-button').addEventListener('click',()=>toast('You have no new notifications.'));
 $('chat-button').addEventListener('click',()=>toast('Chat support is not available right now.'));
})();
</script>
</body></html>
