<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Market Options Company</title>
    <script>
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
      });
    </script>
  </head>
  <body>
    <div id="root">
      <main id="startup-fallback" role="status" aria-live="polite" style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b1220;color:#e8eef8;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center;box-sizing:border-box">
        <section style="max-width:520px">
          <p style="margin:0 0 10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#8fa4c4">Global Market Options Company</p>
          <h1 style="margin:0 0 12px;font-size:clamp(24px,4vw,36px);font-weight:650">Loading your market dashboard</h1>
          <p style="margin:0;color:#aebdd2;line-height:1.6">Please wait while the website starts. If this message remains, reload the page or try again shortly.</p>
        </section>
      </main>
    </div>
    <noscript><div style="padding:24px;font-family:system-ui,sans-serif">Please enable JavaScript to use Global Market Options Company.</div></noscript>
    <script>
      (function () {
        function showStartupError() {
          var root = document.getElementById('root');
          if (!root || root.dataset.appMounted === 'true') return;
          root.innerHTML = '<main role="alert" style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b1220;color:#e8eef8;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;text-align:center;box-sizing:border-box"><section style="max-width:520px"><p style="margin:0 0 10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#8fa4c4">Global Market Options Company</p><h1 style="margin:0 0 12px;font-size:30px">We could not load the dashboard</h1><p style="color:#aebdd2;line-height:1.6">Please refresh the page. If the issue continues, try again shortly.</p><button onclick="window.location.reload()" style="margin-top:12px;padding:10px 18px;border:0;border-radius:8px;background:#dce8f8;color:#102039;font:inherit;font-weight:600;cursor:pointer">Refresh page</button></section></main>';
        }
        window.addEventListener('error', function (event) {
          if (event && (event.error || event.message)) showStartupError();
        });
        window.addEventListener('unhandledrejection', function () { showStartupError(); });
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      window.setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.querySelector('#startup-fallback')) {
          var fallback = root.querySelector('#startup-fallback');
          if (fallback) fallback.setAttribute('aria-label', 'Website is still loading');
        }
      }, 12000);
    </script>
  </body>
</html>
