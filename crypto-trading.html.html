<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Trading - Global Market Options</title>
  <style>
    :root {
      --bg: #030712;
      --card-bg: #0b1329;
      --border: #1e293b;
      --text: #ffffff;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 40px;
    }

    /* Header */
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
    }

    /* Page Content */
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    /* Main Info Card */
    .crypto-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .crypto-card p {
      font-size: 14px;
      color: #cbd5e1;
      margin-top: 8px;
    }

    .crypto-card h2 {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }

    /* Footer */
    footer {
      margin-top: 50px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .footer-email {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .copyright {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 30px;
    }

    .footer-section {
      margin-bottom: 24px;
    }

    .footer-section h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .footer-section ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .footer-section a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
    }
